project:
  type: website
  output-dir: ../blog

website:
  title: "Varun Ravi Varma — Blog"
  description: "Notes on reinforcement learning, multi-agent systems and interpretable AI."
  site-url: https://v3rm1.github.io/blog/
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: "~/home"
        href: https://v3rm1.github.io/
      - text: "blog"
        href: index.qmd
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/v3rm1
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/varun-ravi-varma
        aria-label: LinkedIn

format:
  html:
    theme: [darkly, tokyonight.scss]
    toc: true
    code-copy: true
    reading-time: true
    smooth-scroll: true
    link-external-newwindow: true
    # Tints the browser bar on phones to match the navbar.
    include-in-header:
      text: '<meta name="theme-color" content="#16161e">'
    # Page views and link events (GoatCounter), plus reading progress bar.
    include-after-body:
      text: |
        <div id="reading-progress"></div>
        <script>
          window.addEventListener("scroll", function () {
            var h = document.documentElement;
            var st = h.scrollTop || document.body.scrollTop;
            var sh = h.scrollHeight || document.body.scrollHeight;
            var p = (st / (sh - h.clientHeight)) * 100;
            var el = document.getElementById("reading-progress");
            if (el) el.style.width = p + "%";
          });
          (function () {
            var s = document.createElement("script");
            s.src = "/js/track.js";
            document.body.appendChild(s);
          })();
        </script>

execute:
  # Code cells run once locally; results are stored in _freeze/ and reused,
  # so re-rendering never needs the experiment environment.
  freeze: auto
