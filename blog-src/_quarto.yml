project:
  type: website
  output-dir: ../blog

website:
  title: "Varun Ravi Varma — Blog"
  description: "Notes on reinforcement learning, multi-agent systems and interpretable AI."
  site-url: https://v3rm1.github.io/blog/
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: "~/home"
        href: https://v3rm1.github.io/
      - text: "blog"
        href: index.qmd
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/v3rm1
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/varun-ravi-varma
        aria-label: LinkedIn

format:
  html:
    theme: [darkly, tokyonight.scss]
    toc: true
    code-copy: true
    reading-time: true
    smooth-scroll: true
    link-external-newwindow: true
    # Tints the browser bar on phones to match the navbar.
    include-in-header:
      text: |
        <meta name="theme-color" content="#16161e">
        <script>
          (function () {
            var t = localStorage.getItem("theme");
            if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
              t = "light";
            }
            if (t === "light") document.documentElement.setAttribute("data-theme", "light");
          })();
        </script>
    # Page views and link events (GoatCounter), plus reading progress bar and theme toggle.
    include-after-body:
      text: |
        <div id="reading-progress"></div>
        <script>
          window.addEventListener("scroll", function () {
            var h = document.documentElement;
            var st = h.scrollTop || document.body.scrollTop;
            var sh = h.scrollHeight || document.body.scrollHeight;
            var p = (st / (sh - h.clientHeight)) * 100;
            var el = document.getElementById("reading-progress");
            if (el) el.style.width = p + "%";
          });
          // Add theme toggle button to navbar
          (function () {
            var nav = document.querySelector(".navbar-nav.navbar-nav-scroll.ms-auto");
            if (nav) {
              var li = document.createElement("li");
              li.className = "nav-item";
              var curTheme = document.documentElement.getAttribute("data-theme");
              var label = curTheme === "light" ? "☀️ Light" : "🌙 Dark";
              li.innerHTML = '<button type="button" id="blog-theme-toggle" class="nav-link theme-toggle-btn" style="background:none;border:none;cursor:pointer;" aria-label="Toggle theme">' + label + '</button>';
              nav.appendChild(li);
              document.getElementById("blog-theme-toggle").addEventListener("click", function () {
                var cur = document.documentElement.getAttribute("data-theme");
                var next = cur === "light" ? "dark" : "light";
                if (next === "light") {
                  document.documentElement.setAttribute("data-theme", "light");
                  localStorage.setItem("theme", "light");
                  this.textContent = "☀️ Light";
                } else {
                  document.documentElement.removeAttribute("data-theme");
                  localStorage.setItem("theme", "dark");
                  this.textContent = "🌙 Dark";
                }
              });
            }
          })();
          (function () {
            var s = document.createElement("script");
            s.src = "/js/track.js";
            document.body.appendChild(s);
          })();
        </script>

execute:
  # Code cells run once locally; results are stored in _freeze/ and reused,
  # so re-rendering never needs the experiment environment.
  freeze: auto
